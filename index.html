<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audit Guru</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='45' cy='45' r='35' stroke='%238b5cf6' stroke-width='8' fill='none'/><rect x='30' y='50' width='8' height='20' fill='%232dd4bf'/><rect x='45' y='40' width='8' height='30' fill='%232dd4bf'/><rect x='60' y='30' width='8' height='40' fill='%232dd4bf'/><line x1='70' y1='70' x2='90' y2='90' stroke='%238b5cf6' stroke-width='12' stroke-linecap='round'/></svg>">
    <script>
      // Suppress known environmental errors that don't originate from the app
      (function() {
        const suppressedKeywords = ['MetaMask', 'ethereum', 'property fetch', 'web3'];
        
        window.addEventListener('error', function(event) {
          if (event.message && suppressedKeywords.some(keyword => event.message.includes(keyword))) {
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          const reason = event.reason && (event.reason.message || String(event.reason));
          if (reason && suppressedKeywords.some(keyword => reason.includes(keyword))) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });

        // Also intercept console.error for these specific environmental messages
        const originalConsoleError = console.error;
        console.error = function() {
          const args = Array.from(arguments);
          const message = args.join(' ');
          if (suppressedKeywords.some(keyword => message.includes(keyword))) {
            return;
          }
          originalConsoleError.apply(console, args);
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
